name: Pull Request

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build Plugin JAR
        uses: ./.github/actions/build-plugin-jar
        with:
          java-version: '21'
          gradle-version: '9.4.1'
