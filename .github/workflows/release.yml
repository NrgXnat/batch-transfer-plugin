name: Release

# Attaches the plugin jar to a GitHub Release when the release is published.
# Release - Promote RC to Main pushes the release tag; publishing a GitHub Release
# from that tag runs this on the tagged commit.

on:
  release:
    types:
      - published

jobs:

  release:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build JAR
        uses: ./.github/actions/build-plugin-jar
        with:
          java-version: '21'
          gradle-version: '9.4.1'

      - name: Attach JAR to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ${{ env.jar-path }} --clobber
